PulseTaper=0.55
NozzleRadius=1.25
ThreadSpacing=0.65
MeshSides=12
Breakup=0.65
DropVolume=0.42
DropDuration=1.75
DropHold=1.45
DropLength=5.7
Lifetime=5
CatchPlane=0
CatchDepth=45
