; Teaching Fluid 1.7 - CPU viscous streams / continuous D3D9 mesh.
; Reloads for each new J-key demonstration. No additional on-screen controls.
; Volume is per main pulse in game units cubed, NOT millilitres.
; Viscosity and SurfaceTension are illustrative numerical coefficients.
[Fluid]
